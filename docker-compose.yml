x-live-defaults: &live-defaults
  build: .
  restart: always
  env_file: .env
  environment:
    TZ: Asia/Kolkata
    STRATEGY: ema21
    MODE: live
    OPENALGO_HOST: http://host.docker.internal:5002
    OPENALGO_WS_URL: ws://host.docker.internal:8766
    WEBSOCKET_HOST: host.docker.internal
    WEBSOCKET_PORT: "8766"
  volumes:
    - ./logs:/app/logs

services:
  live_nifty:
    <<: *live-defaults
    container_name: openalgo_live_nifty
    environment:
      TZ: Asia/Kolkata
      STRATEGY: ema21
      MODE: live
      SCRIPT: NIFTY
      OPENALGO_HOST: http://host.docker.internal:5002
      OPENALGO_WS_URL: ws://host.docker.internal:8766
      WEBSOCKET_HOST: host.docker.internal
      WEBSOCKET_PORT: "8766"
    volumes:
      - ./logs:/app/logs
  live_banknifty:
    <<: *live-defaults
    container_name: openalgo_live_banknifty
    environment:
      TZ: Asia/Kolkata
      STRATEGY: ema21
      MODE: live
      SCRIPT: BANKNIFTY
      OPENALGO_HOST: http://host.docker.internal:5002
      OPENALGO_WS_URL: ws://host.docker.internal:8766
      WEBSOCKET_HOST: host.docker.internal
      WEBSOCKET_PORT: "8766"
    volumes:
      - ./logs:/app/logs

