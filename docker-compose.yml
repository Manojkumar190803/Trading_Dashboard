version: '3.8'

x-common-variables: &common-variables
  TZ: Asia/Kolkata
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

x-common-environment: &common-environment
  <<: *common-variables
  OPENALGO_HOST: http://host.docker.internal:5002
  OPENALGO_WS_URL: ws://host.docker.internal:8766
  WEBSOCKET_HOST: host.docker.internal
  WEBSOCKET_PORT: "8766"

x-live-defaults: &live-defaults
  build: .
  restart: always
  env_file: .env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment:
    <<: *common-environment
    STRATEGY: ema21
    MODE: live
  volumes:
    - ./logs:/app/logs
    - ./data:/app/data

services:
  # React Dashboard (Node.js Dev Server)
  react_dashboard:
    build:
      context: .
      dockerfile: Dockerfile.react
    container_name: react_dashboard
    labels:
      com.openalgo.display-name: "React Trading Dashboard"
    ports:
      - "3000:3000"
      - "4000:4000"
    restart: unless-stopped
    volumes:
      - ./frontend-react/src:/app/src
      - ./frontend-react/public:/app/public
      - ./logs:/app/logs
    environment:
      <<: *common-variables
      VITE_APP_TITLE: "Trading Strategy Dashboard"
      VITE_LOGS_DIR: "/logs"
      LOGS_DIR: "/app/logs"
      API_TARGET: http://strategy_worker:5003
      NODE_ENV: development
    depends_on:
      strategy_worker:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Streamlit Dashboard (Legacy Frontend)
  streamlit_interface:
    <<: *live-defaults
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: streamlit_interface
    labels:
      com.openalgo.display-name: "Streamlit Dashboard (Legacy)"
    ports:
      - "8502:8501"
    restart: unless-stopped
    environment:
      <<: *common-environment
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      STREAMLIT_SERVER_PORT: "8501"
      BACKGROUND_WORKER_ENABLED: "false"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data

  # Strategy Worker (Core Engine)
  strategy_worker:
    <<: *live-defaults
    container_name: strategy_worker
    labels:
      com.openalgo.display-name: "Strategy background worker"
    ports:
      - "5003:5003"
    environment:
      <<: *common-environment
      STRATEGY: ${STRATEGY:-ema21}
      MODE: ${MODE:-live}
      BACKGROUND_WORKER_ENABLED: "true"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data

  # One manager owns all supported active dashboard strategies.
  strategy_daemon:
    <<: *live-defaults
    container_name: strategy_daemon
    labels:
      com.openalgo.display-name: "Strategy manager"
    command: ["python3", "strategy_daemon.py"]
    environment:
      <<: *common-environment
      MODE: live
      STRATEGY_FILTER: "21EMA,EMA21,HD,CD,TC,2BC,BO"
      STRATEGY_DASHBOARD_API_URL: http://strategy_worker:5003/api/instruments
      LOGS_DIR: /app/logs
    depends_on:
      strategy_worker:
        condition: service_started

  # Dashboard Data Exporter (Syncs OpenAlgo & Fyers data to React)
  dashboard_exporter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dashboard_exporter
    labels:
      com.openalgo.display-name: "Dashboard Data Exporter"
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *common-environment
      STRATEGY_MODE: ${STRATEGY_MODE:-analyzer}
      EXPORT_INTERVAL: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    command: python3 export_dashboard_data.py both 1
    depends_on:
      - strategy_worker

networks:
  default:
    name: trading-network
