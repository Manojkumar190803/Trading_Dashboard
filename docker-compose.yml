x-live-defaults: &live-defaults
  build: .
  restart: always
  env_file: .env
  environment:
    TZ: Asia/Kolkata
    STRATEGY: ema21
    MODE: live
    OPENALGO_HOST: http://host.docker.internal:5002
    OPENALGO_WS_URL: ws://host.docker.internal:8766
    WEBSOCKET_HOST: host.docker.internal
    WEBSOCKET_PORT: "8766"
  volumes:
    - ./logs:/app/logs

services:
  streamlit_interface:
    <<: *live-defaults
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: streamlit_interface
    labels:
      com.openalgo.display-name: "Streamlit interface"
    ports:
      - "8502:8501"
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      STREAMLIT_SERVER_PORT: "8501"
      OPENALGO_HOST: http://host.docker.internal:5002
      OPENALGO_WS_URL: ws://host.docker.internal:8766
      WEBSOCKET_HOST: host.docker.internal
      WEBSOCKET_PORT: "8766"
      BACKGROUND_WORKER_ENABLED: "true"
    volumes:
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock

  strategy_worker:
    <<: *live-defaults
    container_name: strategy_worker
    labels:
      com.openalgo.display-name: "Strategy background worker"
    environment:
      TZ: Asia/Kolkata
      STRATEGY: ${STRATEGY:-ema21}
      MODE: ${MODE:-live}
      SCRIPT: ${SCRIPT:-NIFTY}
      BACKGROUND_WORKER_ENABLED: "true"
      OPENALGO_HOST: http://host.docker.internal:5002
      OPENALGO_WS_URL: ws://host.docker.internal:8766
      WEBSOCKET_HOST: host.docker.internal
      WEBSOCKET_PORT: "8766"
    volumes:
      - ./logs:/app/logs


